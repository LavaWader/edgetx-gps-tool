# Builds the tool and runs every check (formatting, lint, unit tests on Lua 5.4
# and 5.2, the end-to-end tests on the minified build, mutation testing). A pushed tag
# v* also publishes a release with the zip to unpack onto the SD card.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lua and luamin
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua5.2 zip
          npm install -g luamin@1.0.4

      # The formatter is lua-language-server's (the editor's): the same version
      # as on the development machine, or the two may format differently.
      - name: Install lua-language-server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sfL https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/luals"
          echo "LUALS=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      # Fails on unformatted code instead of formatting it, as `make` would.
      - name: Formatting
        run: make format-check

      - name: Build and check
        run: make check

      - name: Mutation testing
        run: make mutate

      - name: Package
        id: package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          zip_name="GPStool-$version.zip"
          (cd dist && zip -r "../$zip_name" SCRIPTS)
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GPStool-${{ github.ref_name }}.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "GPStool-$TAG.zip" --clobber
